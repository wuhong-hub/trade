[project]
name = "astock"
version = "0.1.0"
description = "A股量化策略推荐 CLI 工具"
requires-python = ">=3.10"
dependencies = [
    "akshare>=1.14",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
astock = "astock.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["astock*"]
